name: Tests

on:
  push:
  pull_request:

jobs:
  model-and-glue:
    name: Model and integration logic (stdlib only, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s tests

  card:
    name: Lovelace card (Node, no npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "tests/card/*.test.mjs"
